# [IA] Claude Code (Claude Opus 5.5) – identidade visual (tema claro/escuro, fonte e cores)
# Identidade: tons de céu (azul) para o dado e tons de terra seca (laranja/vermelho) só para o risco.
# O tema pode ser trocado pelo menu ⋮ → Settings → Choose app theme.

[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.6rem"
showSidebarBorder = true

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f2f1ed"
textColor = "#1f1f1d"
borderColor = "#e2e0da"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#141413"
secondaryBackgroundColor = "#1f1f1d"
textColor = "#f0efec"
borderColor = "#383835"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
